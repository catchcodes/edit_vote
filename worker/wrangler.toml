name = "pie-votes"
main = "index.js"
compatibility_date = "2026-01-01"

# Create with:
#   npx wrangler kv namespace create VOTES
# then paste the returned id below.
[[kv_namespaces]]
binding = "VOTES"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
# Pin this to your Pages origin so other sites cannot write into your data.
# Example: "https://yourname.github.io"
ALLOWED_ORIGIN = "https://REPLACE_WITH_YOURNAME.github.io"

# EXPORT_TOKEN is a secret, not a var:
#   npx wrangler secret put EXPORT_TOKEN
